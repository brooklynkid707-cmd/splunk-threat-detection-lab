#
# inputs.conf - file monitors for the synthetic lab logs. Disabled by
# default; enable after copying data/sample/*.log to $SPLUNK_HOME/etc/apps/
# TA-threat-detection/samples/ (see docs/INSTALL.md). The index and
# sourcetype pairs here must match the data-source macros in macros.conf.
#
[monitor://$SPLUNK_HOME/etc/apps/TA-threat-detection/samples/windows_security.log]
disabled = 1
index = lab_windows
sourcetype = lab:windows:security

[monitor://$SPLUNK_HOME/etc/apps/TA-threat-detection/samples/sysmon.log]
disabled = 1
index = lab_sysmon
sourcetype = lab:sysmon

[monitor://$SPLUNK_HOME/etc/apps/TA-threat-detection/samples/linux_auth.log]
disabled = 1
index = lab_linux
sourcetype = lab:linux:auth

[monitor://$SPLUNK_HOME/etc/apps/TA-threat-detection/samples/firewall.log]
disabled = 1
index = lab_network
sourcetype = lab:firewall
host = FW-EDGE-01

[monitor://$SPLUNK_HOME/etc/apps/TA-threat-detection/samples/dns.log]
disabled = 1
index = lab_network
sourcetype = lab:dns
host = DNS-01
