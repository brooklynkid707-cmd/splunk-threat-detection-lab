#
# transforms.conf - delimiter/regex based extractions referenced from
# props.conf REPORT-* settings, plus the lookup table definitions.
#

############################################################################
# Field extractions
############################################################################
[firewall_pipe_delimited]
DELIMS = "|"
FIELDS = "timestamp", "host", "action", "direction", "src_ip", "src_port", "dest_ip", "dest_port", "protocol", "bytes_in", "bytes_out"

[dns_query_log]
REGEX = ^(?<timestamp>\d{2}-\w{3}-\d{4} \d{2}:\d{2}:\d{2}\.\d{3}) client (?<src_ip>\d{1,3}(?:\.\d{1,3}){3})#(?<src_port>\d+): query: (?<query>\S+) IN (?<record_type>\S+) (?<flags>\S+) \((?<dest_ip>\d{1,3}(?:\.\d{1,3}){3})\)
FORMAT = timestamp::$1 src_ip::$2 src_port::$3 query::$4 record_type::$5 flags::$6 dest_ip::$7

############################################################################
# Lookups (CSV files live in ../lookups/)
############################################################################
[known_bad_ips]
filename = known_bad_ips.csv
case_sensitive_match = false

[known_bad_ports]
filename = known_bad_ports.csv
case_sensitive_match = false

[ip_geo]
filename = ip_geo.csv
match_type = CIDR(ip)
case_sensitive_match = false
