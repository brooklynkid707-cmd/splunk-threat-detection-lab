#
# macros.conf - every detection reaches its data through one of the
# data-source macros below. Pointing the app at a production environment
# means editing these five definitions (index + sourcetype), not 25 searches.
#

[wineventlog_security]
definition = index=lab_windows sourcetype=lab:windows:security
description = Windows Security event log (lab format, CIM-style field aliases applied in props.conf)
iseval = 0

[sysmon]
definition = index=lab_sysmon sourcetype=lab:sysmon
description = Sysmon operational log (EventCode 1, 3, 7, 10, 11, 22)
iseval = 0

[linux_auth]
definition = index=lab_linux sourcetype=lab:linux:auth
description = Linux /var/log/auth.log forwarded over rsyslog (ISO timestamps)
iseval = 0

[firewall]
definition = index=lab_network sourcetype=lab:firewall
description = Edge firewall connection log (pipe delimited)
iseval = 0

[dns]
definition = index=lab_network sourcetype=lab:dns
description = BIND style DNS query log from the internal resolver
iseval = 0

[process_creation]
definition = ((`wineventlog_security` EventCode=4688) OR (`sysmon` EventCode=1))
description = Union of Windows 4688 and Sysmon 1 process creation events; both expose process, process_cmdline, parent_process and user
iseval = 0

[common_ports]
definition = (dest_port IN (22, 25, 53, 80, 123, 143, 443, 465, 587, 993, 995, 8080, 8443))
description = Destination ports that are expected for outbound traffic from workstations; excluded from the rare-port detection
iseval = 0

[lsass_access_allowlist]
definition = (SourceImage IN ("C:\\Program Files\\Windows Defender\\MsMpEng.exe", "C:\\Windows\\System32\\csrss.exe", "C:\\Windows\\System32\\wininit.exe", "C:\\Windows\\System32\\svchost.exe", "C:\\Windows\\System32\\lsass.exe"))
description = Processes that legitimately open handles to lsass.exe (EDR/AV, OS internals)
iseval = 0

[rare_parent_child_allowlist]
definition = ((parent_name="services.exe" child_name="svchost.exe") OR (parent_name="userinit.exe" child_name="explorer.exe") OR (parent_name="msiexec.exe"))
description = Parent/child process pairs that are rare but expected (service start-up, logon chain, installers)
iseval = 0

[dns_subdomain_allowlist]
definition = (base_domain IN ("example.com", "example-cdn.com", "example-update.com"))
description = Base domains whose high subdomain cardinality is normal (CDNs, update services, telemetry)
iseval = 0

[bytes_to_mb(1)]
args = bytes
definition = round($bytes$/1048576, 2)
description = Convert a byte count to megabytes with two decimals
iseval = 0
