#
# eventtypes.conf - named event classes reused by detections and the dashboard.
#

[windows_failed_logon]
search = `wineventlog_security` EventCode=4625
description = Windows logon failure

[windows_successful_logon]
search = `wineventlog_security` EventCode=4624
description = Windows logon success

[windows_remote_interactive_logon]
search = `wineventlog_security` EventCode=4624 logon_type=10
description = RDP (RemoteInteractive) logon

[windows_process_creation]
search = `wineventlog_security` EventCode=4688
description = Windows process creation audit

[windows_account_management]
search = `wineventlog_security` (EventCode=4720 OR EventCode=4732)
description = Account created or added to a security group

[windows_audit_log_cleared]
search = `wineventlog_security` EventCode=1102
description = The Security audit log was cleared

[sysmon_process_creation]
search = `sysmon` EventCode=1
description = Sysmon process create

[sysmon_network_connection]
search = `sysmon` EventCode=3
description = Sysmon network connection

[sysmon_process_access]
search = `sysmon` EventCode=10
description = Sysmon process access (handle opened to another process)

[linux_ssh_failed]
search = `linux_auth` process=sshd action=Failed
description = SSH authentication failure

[linux_ssh_accepted]
search = `linux_auth` process=sshd action=Accepted
description = SSH authentication success

[firewall_outbound_allowed]
search = `firewall` action=allow direction=outbound
description = Outbound connection permitted by the edge firewall

[firewall_inbound_denied]
search = `firewall` action=deny direction=inbound
description = Inbound connection blocked by the edge firewall
