#
# savedsearches.conf - 25 scheduled detections.
#
# Conventions
#   * Every search reaches data through a macro from macros.conf so index and
#     sourcetype names live in one place.
#   * action.correlationsearch.annotations carries the MITRE ATT&CK mapping in
#     the same JSON shape Enterprise Security uses, so the searches can be
#     promoted to ES correlation searches without edits.
#   * alert.severity: 2=low 3=medium 4=high 5=critical
#   * Thresholds are documented in detections/<id>-<slug>.md and docs/TUNING.md.
#   * The harness in harness/ executes these exact search strings.
#

############################################################################
# Credential access / initial access
############################################################################

[TDL-001 Windows Brute Force - Many Failures From One Source]
description = 10 or more Windows logon failures (4625) from a single source address against three or fewer accounts inside five minutes. Few accounts and many attempts is the signature of brute force rather than spraying.
search = `wineventlog_security` EventCode=4625 \
| bin _time span=5m \
| stats count as failures, dc(user) as unique_users, values(user) as users, values(dest) as targets by src_ip, _time \
| where failures>=10 AND unique_users<=3 \
| eval window_start=strftime(_time, "%Y-%m-%d %H:%M") \
| table window_start, src_ip, failures, unique_users, users, targets
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.track = 1
alert.suppress = 1
alert.suppress.fields = src_ip
alert.suppress.period = 1h
action.correlationsearch.enabled = 1
action.correlationsearch.label = Windows Brute Force
action.correlationsearch.annotations = {"mitre_attack": ["T1110.001"], "nist": ["DE.CM-1"]}

[TDL-002 Windows Password Spraying - One Source, Many Accounts]
description = A single source produces failed logons (4625) against 10 or more distinct accounts in a ten-minute window with a low failures-per-account ratio. Spraying tries one or two common passwords across many users to stay under lockout thresholds.
search = `wineventlog_security` EventCode=4625 \
| bin _time span=10m \
| stats dc(user) as unique_users, count as failures, values(user) as users by src_ip, _time \
| eval failures_per_user=round(failures/unique_users, 2) \
| where unique_users>=10 AND failures_per_user<=3 \
| eval window_start=strftime(_time, "%Y-%m-%d %H:%M") \
| table window_start, src_ip, unique_users, failures, failures_per_user, users
cron_schedule = */10 * * * *
dispatch.earliest_time = -30m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.track = 1
alert.suppress = 1
alert.suppress.fields = src_ip
alert.suppress.period = 1h
action.correlationsearch.enabled = 1
action.correlationsearch.label = Windows Password Spraying
action.correlationsearch.annotations = {"mitre_attack": ["T1110.003"], "nist": ["DE.CM-1"]}

[TDL-003 Impossible Travel - Same User, Two Countries Within One Hour]
description = Successful network or RDP logons (4624) for the same account from public source addresses that geolocate to two different countries less than an hour apart. Uses the ip_geo CIDR lookup; internal ranges are ignored.
search = `wineventlog_security` EventCode=4624 logon_type IN (3, 10) src_ip=* \
| lookup ip_geo ip AS src_ip OUTPUT country \
| where isnotnull(country) AND country!="internal" \
| sort 0 user, _time \
| streamstats current=f last(country) as prev_country, last(src_ip) as prev_src_ip, last(_time) as prev_time by user \
| where isnotnull(prev_country) AND country!=prev_country AND (_time-prev_time)<=3600 \
| eval minutes_between=round((_time-prev_time)/60, 1), logon_time=strftime(_time, "%Y-%m-%d %H:%M:%S") \
| table logon_time, user, prev_src_ip, prev_country, src_ip, country, minutes_between, dest
cron_schedule = */15 * * * *
dispatch.earliest_time = -2h
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.track = 1
alert.suppress = 1
alert.suppress.fields = user
alert.suppress.period = 4h
action.correlationsearch.enabled = 1
action.correlationsearch.label = Impossible Travel
action.correlationsearch.annotations = {"mitre_attack": ["T1078", "T1078.004"], "nist": ["DE.AE-2"]}

############################################################################
# Persistence / privilege escalation
############################################################################

[TDL-004 New Account Created And Added To Administrators]
description = An account is created (4720) and the same account is added to Administrators, Domain Admins or Enterprise Admins (4732) within the search window. Backdoor admin accounts are a classic persistence step after initial compromise.
search = `wineventlog_security` (EventCode=4720 OR (EventCode=4732 Group_Name IN ("Administrators", "Domain Admins", "Enterprise Admins"))) \
| eval target_user=coalesce(Target_Account_Name, Member_Name) \
| stats count(eval(EventCode=4720)) as created, count(eval(EventCode=4732)) as added_to_admin_group, values(Group_Name) as groups, values(Subject_Account_Name) as actor, min(_time) as first_seen, max(_time) as last_seen by target_user, dest \
| where created>0 AND added_to_admin_group>0 \
| eval first_seen=strftime(first_seen, "%Y-%m-%d %H:%M:%S"), last_seen=strftime(last_seen, "%Y-%m-%d %H:%M:%S") \
| table first_seen, last_seen, dest, actor, target_user, groups
cron_schedule = */15 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 5
alert.track = 1
alert.suppress = 1
alert.suppress.fields = target_user
alert.suppress.period = 24h
action.correlationsearch.enabled = 1
action.correlationsearch.label = New Admin Account
action.correlationsearch.annotations = {"mitre_attack": ["T1136.001", "T1098"], "nist": ["DE.CM-3"]}

[TDL-008 Scheduled Task Created By Interactive User]
description = A scheduled task is created either through the Security log (4698) or by schtasks.exe /create seen in Sysmon. Tasks created by computer accounts or under the \Microsoft\Windows\ tree are excluded because Windows and its updaters create those constantly.
search = (`wineventlog_security` EventCode=4698) OR (`sysmon` EventCode=1 process="*\\schtasks.exe" process_cmdline="*/create*") \
| eval task=coalesce(Task_Name, process_cmdline) \
| search NOT user="*$" NOT Task_Name="\\Microsoft\\Windows\\*" \
| eval event_time=strftime(_time, "%Y-%m-%d %H:%M:%S") \
| table event_time, host, user, EventCode, task, parent_process
cron_schedule = */15 * * * *
dispatch.earliest_time = -30m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 3
alert.track = 1
action.correlationsearch.enabled = 1
action.correlationsearch.label = Scheduled Task Created
action.correlationsearch.annotations = {"mitre_attack": ["T1053.005"], "nist": ["DE.CM-7"]}

[TDL-019 Privilege Escalation Attempt Via runas To Admin Account]
description = runas.exe launched with /user: pointing at an administrator or root style account. Interactive users elevating to a different privileged account from a workstation is unusual and often follows credential theft.
search = `sysmon` EventCode=1 process="*\\runas.exe" \
| rex field=process_cmdline "(?i)/user:(?<target_account>\S+)" \
| search target_account IN ("*admin*", "*\\administrator", "administrator", "*root*") \
| eval event_time=strftime(_time, "%Y-%m-%d %H:%M:%S") \
| table event_time, host, user, target_account, process_cmdline, parent_process
cron_schedule = */15 * * * *
dispatch.earliest_time = -30m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 3
alert.track = 1
action.correlationsearch.enabled = 1
action.correlationsearch.label = runas Privilege Escalation
action.correlationsearch.annotations = {"mitre_attack": ["T1078.002", "T1548"], "nist": ["DE.CM-3"]}

[TDL-023 Unsigned DLL Loaded From User-Writable Path]
description = Sysmon ImageLoad (7) where the DLL is unsigned and lives in Temp, AppData, Users\Public, ProgramData or Downloads. Legitimate software loads signed DLLs from Program Files or System32; this pattern is typical of DLL side-loading and search-order hijacking.
search = `sysmon` EventCode=7 Signed=false ImageLoaded IN ("*\\Temp\\*", "*\\AppData\\*", "*\\Users\\Public\\*", "*\\ProgramData\\*", "*\\Downloads\\*") \
| stats count as loads, values(process) as loading_processes, values(user) as users, min(_time) as first_seen by host, ImageLoaded, Signed \
| eval first_seen=strftime(first_seen, "%Y-%m-%d %H:%M:%S") \
| table first_seen, host, ImageLoaded, loading_processes, users, loads
cron_schedule = */15 * * * *
dispatch.earliest_time = -30m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 3
alert.track = 1
action.correlationsearch.enabled = 1
action.correlationsearch.label = Unsigned DLL From User Path
action.correlationsearch.annotations = {"mitre_attack": ["T1574.002", "T1574.001"], "nist": ["DE.CM-4"]}

[TDL-024 File Dropped In Startup Folder]
description = Sysmon FileCreate (11) into a Start Menu\Programs\Startup folder by anything other than an installer. Startup folder entries execute at every logon and are one of the simplest persistence mechanisms.
search = `sysmon` EventCode=11 TargetFilename="*\\Start Menu\\Programs\\Startup\\*" \
| search NOT process="*\\msiexec.exe" \
| eval event_time=strftime(_time, "%Y-%m-%d %H:%M:%S") \
| table event_time, host, user, process, TargetFilename
cron_schedule = */15 * * * *
dispatch.earliest_time = -30m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 3
alert.track = 1
action.correlationsearch.enabled = 1
action.correlationsearch.label = Startup Folder Persistence
action.correlationsearch.annotations = {"mitre_attack": ["T1547.001"], "nist": ["DE.CM-7"]}

############################################################################
# Lateral movement
############################################################################

[TDL-005 Lateral Movement - RDP To Multiple Hosts By One User]
description = One account completes RemoteInteractive (logon type 10) logons to four or more distinct hosts within an hour. Administrators usually RDP to one or two systems per hour; fanning out across many hosts is how an operator moves laterally with stolen credentials.
search = `wineventlog_security` EventCode=4624 logon_type=10 \
| bin _time span=1h \
| stats dc(dest) as unique_hosts, values(dest) as hosts, values(src_ip) as src_ips, count as logons by user, _time \
| where unique_hosts>=4 \
| eval window_start=strftime(_time, "%Y-%m-%d %H:%M") \
| table window_start, user, unique_hosts, hosts, src_ips, logons
cron_schedule = */15 * * * *
dispatch.earliest_time = -2h
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.track = 1
alert.suppress = 1
alert.suppress.fields = user
alert.suppress.period = 2h
action.correlationsearch.enabled = 1
action.correlationsearch.label = RDP Lateral Movement
action.correlationsearch.annotations = {"mitre_attack": ["T1021.001"], "nist": ["DE.AE-1"]}

[TDL-006 Lateral Movement - SMB Fan-Out From One Host]
description = A single host initiates outbound TCP 445 connections to five or more distinct internal hosts inside ten minutes (Sysmon 3). Workstations normally talk SMB to a couple of file servers and domain controllers; fan-out to many peers indicates PsExec style movement, share enumeration or worm behaviour.
search = `sysmon` EventCode=3 Initiated=true dest_port=445 \
| bin _time span=10m \
| stats dc(dest_ip) as unique_dests, values(dest_ip) as dests, values(process) as processes, values(user) as users by src_ip, host, _time \
| where unique_dests>=5 \
| eval window_start=strftime(_time, "%Y-%m-%d %H:%M") \
| table window_start, host, src_ip, unique_dests, dests, processes, users
cron_schedule = */10 * * * *
dispatch.earliest_time = -30m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.track = 1
alert.suppress = 1
alert.suppress.fields = src_ip
alert.suppress.period = 1h
action.correlationsearch.enabled = 1
action.correlationsearch.label = SMB Lateral Movement
action.correlationsearch.annotations = {"mitre_attack": ["T1021.002"], "nist": ["DE.AE-1"]}

############################################################################
# Execution / defense evasion / credential dumping
############################################################################

[TDL-007 PowerShell Encoded Command]
description = PowerShell launched with an -EncodedCommand style switch (any abbreviation from -e to -encodedcommand) followed by a Base64 blob of 40 or more characters, observed in either Windows 4688 or Sysmon 1. Encoding is used to hide the real script from command-line logging.
search = `process_creation` (process="*\\powershell.exe" OR process="*\\pwsh.exe") \
| rex field=process_cmdline "(?i)\s-(?<enc_flag>e|ec|en|enc|enco|encod|encode|encoded|encodedcommand)\s+(?<encoded_payload>[A-Za-z0-9+/=]{40,})" \
| where isnotnull(encoded_payload) \
| eval payload_length=len(encoded_payload), event_time=strftime(_time, "%Y-%m-%d %H:%M:%S") \
| dedup host, user, process_cmdline \
| table event_time, host, user, parent_process, process_cmdline, payload_length
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.track = 1
action.correlationsearch.enabled = 1
action.correlationsearch.label = PowerShell Encoded Command
action.correlationsearch.annotations = {"mitre_attack": ["T1059.001", "T1027.010"], "nist": ["DE.CM-4"]}

[TDL-012 Office Application Spawning Shell Or Script Host]
description = Word, Excel, PowerPoint or Outlook spawning cmd, PowerShell, a script host, mshta, rundll32, regsvr32 or certutil (Sysmon 1). Office applications have no business launching these; the pattern is the hallmark of a macro or exploit document.
search = `sysmon` EventCode=1 parent_process IN ("*\\winword.exe", "*\\excel.exe", "*\\powerpnt.exe", "*\\outlook.exe") process IN ("*\\cmd.exe", "*\\powershell.exe", "*\\pwsh.exe", "*\\wscript.exe", "*\\cscript.exe", "*\\mshta.exe", "*\\rundll32.exe", "*\\regsvr32.exe", "*\\certutil.exe") \
| eval event_time=strftime(_time, "%Y-%m-%d %H:%M:%S") \
| table event_time, host, user, parent_process, process, process_cmdline
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 5
alert.track = 1
action.correlationsearch.enabled = 1
action.correlationsearch.label = Office Spawns Shell
action.correlationsearch.annotations = {"mitre_attack": ["T1566.001", "T1204.002"], "nist": ["DE.CM-4"]}

[TDL-013 Rare Parent-Child Process Pair]
description = Statistically rare parent/child process combinations across the Sysmon 1 population (three or fewer occurrences). This is a hunting-grade detection: it surfaces oddities like mshta spawning rundll32 or wmiprvse spawning PowerShell, but will also show legitimate one-off admin activity, so expect to tune the allowlist macro.
search = `sysmon` EventCode=1 \
| eval parent_name=lower(replace(parent_process, "^.*\\\\", "")), child_name=lower(replace(process, "^.*\\\\", "")) \
| rare limit=25 parent_name, child_name \
| where count<=3 \
| search NOT `rare_parent_child_allowlist` \
| table parent_name, child_name, count, percent
cron_schedule = 0 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 2
alert.track = 1
action.correlationsearch.enabled = 1
action.correlationsearch.label = Rare Parent Child Process
action.correlationsearch.annotations = {"mitre_attack": ["T1059", "T1218"], "nist": ["DE.AE-1"]}

[TDL-014 LSASS Memory Access By Non-Allowlisted Process]
description = Sysmon ProcessAccess (10) where a process not on the allowlist opens lsass.exe with an access mask associated with credential dumping (0x1010, 0x1410, 0x1438, 0x143A, 0x1F0FFF, 0x1F1FFF, 0x1F3FFF, 0x1FFFFF). Mimikatz, procdump and comsvcs.dll MiniDump all produce these masks.
search = `sysmon` EventCode=10 TargetImage="*\\lsass.exe" \
| search NOT `lsass_access_allowlist` \
| search GrantedAccess IN ("0x1010", "0x1410", "0x1438", "0x143A", "0x1F0FFF", "0x1F1FFF", "0x1F3FFF", "0x1FFFFF") \
| stats count as access_attempts, values(GrantedAccess) as access_masks, values(CallTrace) as call_traces, min(_time) as first_seen by host, user, SourceImage, TargetImage \
| eval first_seen=strftime(first_seen, "%Y-%m-%d %H:%M:%S") \
| table first_seen, host, user, SourceImage, access_masks, access_attempts, call_traces
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 5
alert.track = 1
action.correlationsearch.enabled = 1
action.correlationsearch.label = LSASS Access
action.correlationsearch.annotations = {"mitre_attack": ["T1003.001"], "nist": ["DE.CM-4"]}

[TDL-015 Windows Event Log Cleared]
description = The Security log was cleared (1102) or wevtutil / Clear-EventLog was executed. Attackers clear logs to remove evidence after an intrusion; there is almost no legitimate reason for this outside of planned maintenance.
search = (`wineventlog_security` EventCode=1102) OR (`sysmon` EventCode=1 process="*\\wevtutil.exe" (process_cmdline="* cl *" OR process_cmdline="* clear-log *")) OR (`sysmon` EventCode=1 process="*\\powershell.exe" process_cmdline="*Clear-EventLog*") \
| eval detail=coalesce(process_cmdline, "Security audit log cleared (EventCode 1102)"), event_time=strftime(_time, "%Y-%m-%d %H:%M:%S") \
| table event_time, host, user, EventCode, detail
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 5
alert.track = 1
action.correlationsearch.enabled = 1
action.correlationsearch.label = Event Log Cleared
action.correlationsearch.annotations = {"mitre_attack": ["T1070.001"], "nist": ["DE.CM-4"]}

[TDL-025 DNS Query From Scripting Or LOLBin Process]
description = Sysmon DNS query (22) issued by PowerShell, rundll32, regsvr32, mshta, wscript/cscript, certutil, bitsadmin or msbuild. Browsers, mail clients and svchost resolve names all day; living-off-the-land binaries doing it usually means a downloader or C2 stage.
search = `sysmon` EventCode=22 process IN ("*\\powershell.exe", "*\\pwsh.exe", "*\\rundll32.exe", "*\\regsvr32.exe", "*\\mshta.exe", "*\\wscript.exe", "*\\cscript.exe", "*\\certutil.exe", "*\\bitsadmin.exe", "*\\msbuild.exe") \
| stats count as queries, dc(query) as unique_domains, values(query) as domains, values(user) as users, min(_time) as first_seen by host, process \
| eval first_seen=strftime(first_seen, "%Y-%m-%d %H:%M:%S") \
| table first_seen, host, process, users, unique_domains, domains, queries
cron_schedule = */15 * * * *
dispatch.earliest_time = -30m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 3
alert.track = 1
action.correlationsearch.enabled = 1
action.correlationsearch.label = DNS From LOLBin
action.correlationsearch.annotations = {"mitre_attack": ["T1071.004", "T1218"], "nist": ["DE.CM-4"]}

############################################################################
# Command and control / exfiltration (network)
############################################################################

[TDL-009 DNS Tunneling - Abnormally Long Query Names]
description = Ten or more DNS queries of 50+ characters from one client to the same base domain. DNS tunnels (iodine, dnscat2, Cobalt Strike DNS beacons) encode data into long subdomain labels; ordinary hostnames are far shorter.
search = `dns` \
| eval query_length=len(query) \
| where query_length>=50 \
| rex field=query "(?<base_domain>[^.]+\.[^.]+)$" \
| stats count as long_queries, avg(query_length) as avg_length, max(query_length) as max_length, dc(query) as unique_queries, values(query) as sample_queries by src_ip, base_domain \
| where long_queries>=10 \
| eval avg_length=round(avg_length, 1) \
| table src_ip, base_domain, long_queries, unique_queries, avg_length, max_length, sample_queries
cron_schedule = */15 * * * *
dispatch.earliest_time = -1h
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.track = 1
alert.suppress = 1
alert.suppress.fields = src_ip,base_domain
alert.suppress.period = 4h
action.correlationsearch.enabled = 1
action.correlationsearch.label = DNS Tunneling Long Queries
action.correlationsearch.annotations = {"mitre_attack": ["T1071.004", "T1048.003"], "nist": ["DE.AE-1"]}

[TDL-010 DNS - Excessive Unique Subdomains For One Base Domain]
description = One client resolves 100 or more distinct subdomains of the same base domain inside ten minutes. High subdomain cardinality to a single zone is how DNS exfiltration and fast-flux C2 look even when individual names are short. CDNs and update services are allowlisted by macro.
search = `dns` \
| rex field=query "(?<base_domain>[^.]+\.[^.]+)$" \
| bin _time span=10m \
| stats dc(query) as unique_subdomains, count as queries by src_ip, base_domain, _time \
| where unique_subdomains>=100 \
| search NOT `dns_subdomain_allowlist` \
| eval window_start=strftime(_time, "%Y-%m-%d %H:%M") \
| table window_start, src_ip, base_domain, unique_subdomains, queries
cron_schedule = */10 * * * *
dispatch.earliest_time = -30m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.track = 1
alert.suppress = 1
alert.suppress.fields = src_ip,base_domain
alert.suppress.period = 4h
action.correlationsearch.enabled = 1
action.correlationsearch.label = DNS Subdomain Cardinality
action.correlationsearch.annotations = {"mitre_attack": ["T1048.003", "T1071.004"], "nist": ["DE.AE-1"]}

[TDL-011 Beaconing - Regular Interval Outbound Connections]
description = A source/destination pair with 20 or more outbound connections whose inter-arrival times are nearly constant (coefficient of variation below 0.2, mean interval at least 30 seconds). Human and application traffic is bursty; C2 implants check in on a timer.
search = `firewall` action=allow direction=outbound \
| sort 0 src_ip, dest_ip, _time \
| streamstats current=f last(_time) as prev_time by src_ip, dest_ip \
| eval delta=_time-prev_time \
| where isnotnull(delta) \
| stats count as connections, avg(delta) as avg_interval, stdev(delta) as stdev_interval, values(dest_port) as dest_ports, min(_time) as first_seen, max(_time) as last_seen by src_ip, dest_ip \
| eval jitter_ratio=round(stdev_interval/avg_interval, 3), avg_interval=round(avg_interval, 1) \
| where connections>=20 AND avg_interval>=30 AND jitter_ratio<0.2 \
| lookup known_bad_ips ip AS dest_ip OUTPUTNEW threat_category \
| eval first_seen=strftime(first_seen, "%Y-%m-%d %H:%M:%S"), last_seen=strftime(last_seen, "%Y-%m-%d %H:%M:%S") \
| table src_ip, dest_ip, dest_ports, connections, avg_interval, jitter_ratio, first_seen, last_seen, threat_category
cron_schedule = 0 * * * *
dispatch.earliest_time = -4h
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.track = 1
alert.suppress = 1
alert.suppress.fields = src_ip,dest_ip
alert.suppress.period = 12h
action.correlationsearch.enabled = 1
action.correlationsearch.label = Beaconing
action.correlationsearch.annotations = {"mitre_attack": ["T1071.001", "T1571"], "nist": ["DE.AE-1"]}

[TDL-016 Outbound Connection On Rare Destination Port]
description = Allowed outbound connections to a destination port that is not in the common-port macro and is used by five or fewer connections across the whole window. Reverse shells and C2 frameworks frequently use ports like 4444, 1337 or 50050 that nothing else in the environment touches. Enriched with the known_bad_ports lookup.
search = `firewall` action=allow direction=outbound \
| search NOT `common_ports` \
| eventstats count as connections_on_port, dc(src_ip) as sources_using_port by dest_port \
| where connections_on_port<=5 \
| stats count as connections, values(dest_ip) as dest_ips, sum(bytes_out) as bytes_out, min(_time) as first_seen by src_ip, dest_port, connections_on_port, sources_using_port \
| lookup known_bad_ports port AS dest_port OUTPUTNEW description AS port_description \
| eval first_seen=strftime(first_seen, "%Y-%m-%d %H:%M:%S") \
| table first_seen, src_ip, dest_port, dest_ips, connections, sources_using_port, bytes_out, port_description
cron_schedule = */15 * * * *
dispatch.earliest_time = -1h
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 3
alert.track = 1
action.correlationsearch.enabled = 1
action.correlationsearch.label = Rare Outbound Port
action.correlationsearch.annotations = {"mitre_attack": ["T1571", "T1095"], "nist": ["DE.AE-1"]}

[TDL-017 Connection To Known-Bad IP (Threat Intel Match)]
description = Any firewall event whose destination matches the known_bad_ips lookup (C2, exfil, malware distribution, phishing). Aggregated per source/destination so one alert summarises the whole conversation including bytes out and whether the firewall allowed or denied it.
search = `firewall` \
| lookup known_bad_ips ip AS dest_ip OUTPUT threat_category, threat_source, confidence \
| where isnotnull(threat_category) \
| stats count as connections, sum(bytes_out) as bytes_out, values(dest_port) as dest_ports, values(action) as actions, min(_time) as first_seen, max(_time) as last_seen by src_ip, dest_ip, threat_category, threat_source, confidence \
| eval first_seen=strftime(first_seen, "%Y-%m-%d %H:%M:%S"), last_seen=strftime(last_seen, "%Y-%m-%d %H:%M:%S") \
| table first_seen, last_seen, src_ip, dest_ip, threat_category, confidence, actions, dest_ports, connections, bytes_out
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 5
alert.track = 1
alert.suppress = 1
alert.suppress.fields = src_ip,dest_ip
alert.suppress.period = 4h
action.correlationsearch.enabled = 1
action.correlationsearch.label = Threat Intel IP Match
action.correlationsearch.annotations = {"mitre_attack": ["T1071", "T1105"], "nist": ["DE.CM-1"]}

[TDL-018 Data Exfiltration - Outbound Volume Spike Per Host]
description = A host sends more than 100 MB outbound in one hour and that hour exceeds the host's own mean plus three standard deviations across the search window. Per-host baselining avoids flagging servers that always push a lot of data while still catching a workstation that suddenly uploads gigabytes.
search = `firewall` action=allow direction=outbound \
| bin _time span=1h \
| stats sum(bytes_out) as bytes_out, dc(dest_ip) as unique_dests, values(dest_ip) as dest_ips by src_ip, _time \
| eventstats avg(bytes_out) as baseline_avg, stdev(bytes_out) as baseline_stdev by src_ip \
| fillnull value=0 baseline_stdev \
| eval threshold=baseline_avg+3*baseline_stdev \
| where bytes_out>104857600 AND bytes_out>threshold \
| eval window_start=strftime(_time, "%Y-%m-%d %H:%M"), mb_out=`bytes_to_mb(bytes_out)`, baseline_mb=`bytes_to_mb(baseline_avg)` \
| table window_start, src_ip, mb_out, baseline_mb, unique_dests, dest_ips
cron_schedule = 0 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.track = 1
alert.suppress = 1
alert.suppress.fields = src_ip
alert.suppress.period = 4h
action.correlationsearch.enabled = 1
action.correlationsearch.label = Exfiltration Volume Spike
action.correlationsearch.annotations = {"mitre_attack": ["T1048", "T1041"], "nist": ["DE.AE-1"]}

