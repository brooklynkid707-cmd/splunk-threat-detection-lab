[TDL-020 Linux SSH Brute Force]
description = 20 or more failed SSH authentications from one source address against one host inside ten minutes. Internet-facing SSH is constantly scanned, so the threshold is deliberately higher than the Windows equivalent and the alert groups by host.
search = `linux_auth` process=sshd action=Failed \
| bin _time span=10m \
| stats count as failures, dc(user) as unique_users, values(user) as users by src_ip, host, _time \
| where failures>=20 \
| eval window_start=strftime(_time, "%Y-%m-%d %H:%M") \
| table window_start, host, src_ip, failures, unique_users, users
cron_schedule = */10 * * * *
dispatch.earliest_time = -30m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 3
alert.track = 1
alert.suppress = 1
alert.suppress.fields = src_ip,host
alert.suppress.period = 1h
action.correlationsearch.enabled = 1
action.correlationsearch.label = Linux SSH Brute Force
action.correlationsearch.annotations = {"mitre_attack": ["T1110.001"], "nist": ["DE.CM-1"]}

[TDL-021 Linux SSH Success After Repeated Failures]
description = A source address accumulates five or more SSH failures within 30 minutes and then authenticates successfully. This is the "brute force that worked" case and is far more urgent than the failures alone.
search = `linux_auth` process=sshd (action=Failed OR action=Accepted) \
| sort 0 src_ip, _time \
| streamstats time_window=30m count(eval(action="Failed")) as prior_failures by src_ip \
| where action="Accepted" AND prior_failures>=5 \
| eval event_time=strftime(_time, "%Y-%m-%d %H:%M:%S") \
| table event_time, host, src_ip, user, auth_method, prior_failures
cron_schedule = */10 * * * *
dispatch.earliest_time = -1h
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 5
alert.track = 1
action.correlationsearch.enabled = 1
action.correlationsearch.label = SSH Success After Failures
action.correlationsearch.annotations = {"mitre_attack": ["T1110.001", "T1078"], "nist": ["DE.CM-1"]}

[TDL-022 Linux New User Added To sudo/wheel Group]
description = A user account is created with useradd and the same account is added to the sudo, wheel or admin group within the search window. Mirrors the Windows new-admin detection for Linux hosts.
search = `linux_auth` (process=useradd OR process=usermod) \
| eval target_user=coalesce(new_user, mod_user) \
| stats count(eval(process="useradd")) as created, count(eval(in(group, "sudo", "wheel", "admin"))) as added_to_sudo, values(group) as groups, values(host) as hosts, min(_time) as first_seen by target_user \
| where created>0 AND added_to_sudo>0 \
| eval first_seen=strftime(first_seen, "%Y-%m-%d %H:%M:%S") \
| table first_seen, hosts, target_user, groups
cron_schedule = */15 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.track = 1
alert.suppress = 1
alert.suppress.fields = target_user
alert.suppress.period = 24h
action.correlationsearch.enabled = 1
action.correlationsearch.label = Linux New sudo User
action.correlationsearch.annotations = {"mitre_attack": ["T1136.001", "T1548.003"], "nist": ["DE.CM-3"]}
