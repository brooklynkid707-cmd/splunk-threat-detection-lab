#
# props.conf - parsing and search-time field extraction for the five lab
# sourcetypes. The Python harness (harness/extract.py) reads this same file
# and applies TIME_PREFIX/TIME_FORMAT, REPORT-*, EXTRACT-*, KV_MODE,
# FIELDALIAS-* and EVAL-* in Splunk's search-time order, so the fields the
# detections see in the harness are the fields Splunk would produce.
#

############################################################################
# Windows Security event log (single-line key=value export)
#
# 2026-10-14T02:11:05Z host=DC-01 EventCode=4625 Account_Name=svc_backup \
#   Logon_Type=3 Source_Network_Address=203.0.113.45 Status=0xC000006D ...
############################################################################
[lab:windows:security]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 20000
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 20
TZ = UTC
KV_MODE = auto
# CIM-style aliases so detections can be written once against user/src_ip/dest
FIELDALIAS-win_user = Account_Name AS user
FIELDALIAS-win_src = Source_Network_Address AS src_ip
FIELDALIAS-win_dest = host AS dest
FIELDALIAS-win_logon_type = Logon_Type AS logon_type
FIELDALIAS-win_process = New_Process_Name AS process
FIELDALIAS-win_cmdline = Process_Command_Line AS process_cmdline
FIELDALIAS-win_parent = Creator_Process_Name AS parent_process
FIELDALIAS-win_target_user = Target_Account_Name AS target_user
EVAL-action = case(EventCode=4624, "success", EventCode=4625, "failure")
EVAL-signature = case(EventCode=4624, "An account was successfully logged on", EventCode=4625, "An account failed to log on", EventCode=4688, "A new process has been created", EventCode=4720, "A user account was created", EventCode=4732, "A member was added to a security-enabled local group", EventCode=1102, "The audit log was cleared", EventCode=4698, "A scheduled task was created")

############################################################################
# Sysmon operational log (single-line key=value export)
############################################################################
[lab:sysmon]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 20000
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 20
TZ = UTC
KV_MODE = auto
FIELDALIAS-sysmon_process = Image AS process
FIELDALIAS-sysmon_cmdline = CommandLine AS process_cmdline
FIELDALIAS-sysmon_parent = ParentImage AS parent_process
FIELDALIAS-sysmon_user = User AS user
FIELDALIAS-sysmon_src_ip = SourceIp AS src_ip
FIELDALIAS-sysmon_src_port = SourcePort AS src_port
FIELDALIAS-sysmon_dest_ip = DestinationIp AS dest_ip
FIELDALIAS-sysmon_dest_port = DestinationPort AS dest_port
FIELDALIAS-sysmon_dest_host = DestinationHostname AS dest
FIELDALIAS-sysmon_query = QueryName AS query
EVAL-process_name = lower(replace(Image, "^.*\\\\", ""))
EVAL-parent_process_name = lower(replace(ParentImage, "^.*\\\\", ""))

############################################################################
# Linux auth.log via rsyslog (RFC 3339 timestamp, year included)
#
# 2026-10-14T02:11:05+00:00 srv-web-01 sshd[2211]: Failed password for root from 203.0.113.9 port 51234 ssh2
############################################################################
[lab:linux:auth]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%z
MAX_TIMESTAMP_LOOKAHEAD = 32
KV_MODE = none
EXTRACT-syslog_header = ^(?<timestamp>\S+)\s+(?<host>\S+)\s+(?<process>[\w\-\/\.]+)(?:\[(?<pid>\d+)\])?:\s+(?<message>.*)$
EXTRACT-ssh_auth = (?<action>Failed|Accepted) (?<auth_method>password|publickey) for (?:invalid user )?(?<user>\S+) from (?<src_ip>\d{1,3}(?:\.\d{1,3}){3}) port (?<src_port>\d+)
EXTRACT-ssh_invalid_user = Failed password for (?<invalid_user>invalid user) \S+ from
EXTRACT-sudo_cmd = sudo:\s+(?<user>\S+) : TTY=(?<tty>\S+) ; PWD=(?<pwd>\S+) ; USER=(?<run_as>\S+) ; COMMAND=(?<command>.*)$
EXTRACT-useradd = useradd\[\d+\]: new user: name=(?<new_user>[^,]+), UID=(?<uid>\d+), GID=(?<gid>\d+), home=(?<home>[^,]+), shell=(?<shell>\S+)
EXTRACT-usermod_group = usermod\[\d+\]: add '(?<mod_user>[^']+)' to group '(?<group>[^']+)'
FIELDALIAS-linux_dest = host AS dest

############################################################################
# Edge firewall connection log (pipe delimited, parsed by transforms.conf)
#
# 2026-10-14T02:11:05Z|FW-EDGE-01|allow|outbound|10.20.1.55|52344|203.0.113.50|443|tcp|1532|84211
############################################################################
[lab:firewall]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 20
TZ = UTC
KV_MODE = none
REPORT-firewall_fields = firewall_pipe_delimited
EVAL-bytes = bytes_in + bytes_out
FIELDALIAS-fw_dest = dest_ip AS dest
FIELDALIAS-fw_src = src_ip AS src

############################################################################
# BIND style query log from the internal resolver
#
# 14-Oct-2026 02:11:05.117 client 10.20.1.55#51234: query: www.example.com IN A + (10.10.0.53)
############################################################################
[lab:dns]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
TIME_FORMAT = %d-%b-%Y %H:%M:%S.%3N
MAX_TIMESTAMP_LOOKAHEAD = 24
TZ = UTC
KV_MODE = none
REPORT-dns_fields = dns_query_log
EVAL-query_length = len(query)
