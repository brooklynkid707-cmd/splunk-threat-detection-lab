#
# tags.conf - CIM style tags so the eventtypes above can feed the
# Authentication / Endpoint / Network_Traffic data models.
#

[eventtype=windows_failed_logon]
authentication = enabled
failure = enabled

[eventtype=windows_successful_logon]
authentication = enabled
success = enabled

[eventtype=windows_process_creation]
process = enabled
endpoint = enabled

[eventtype=sysmon_process_creation]
process = enabled
endpoint = enabled

[eventtype=sysmon_network_connection]
network = enabled
communicate = enabled

[eventtype=linux_ssh_failed]
authentication = enabled
failure = enabled

[eventtype=linux_ssh_accepted]
authentication = enabled
success = enabled

[eventtype=firewall_outbound_allowed]
network = enabled
communicate = enabled

[eventtype=firewall_inbound_denied]
network = enabled
communicate = enabled
